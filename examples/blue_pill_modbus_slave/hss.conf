# Base config for the Blue Pill Modbus slave example.
HSS_ENABLE_FREEMODBUS=y
HSS_ENABLE_MAX31865=y
HSS_ENABLE_MODBUS_DEBUG=n
HSS_ENABLE_EEPROM_EMULATION=y
HSS_CONSOLE_STDIO_TIMEOUT_MS=1000
HSS_EEPROM_FLASH_ORIGIN=0x0800F800
HSS_EEPROM_FLASH_SIZE=2048
HSS_EEPROM_PAGE_SIZE=1024
HSS_EEPROM_SLOT_COUNT=32

APP_DEVICE_NAME="blue-pill-modbus-slave"
APP_BOARD_REVISION="A"
APP_MODBUS_SLAVE_ID=1
APP_HOLDING_REGISTER_COUNT=8
