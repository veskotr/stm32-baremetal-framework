# Base config for the EEPROM persistence demo example.
HSS_ENABLE_EEPROM_EMULATION=y
HSS_CONSOLE_STDIO_TIMEOUT_MS=1000
HSS_EEPROM_FLASH_ORIGIN=0x0800F800
HSS_EEPROM_FLASH_SIZE=2048
HSS_EEPROM_PAGE_SIZE=1024
HSS_EEPROM_SLOT_COUNT=32

APP_BOOT_COUNT_KEY=0
APP_BLINK_ON_MS=120
APP_BLINK_OFF_MS=120
APP_BLINK_GROUP_GAP_MS=900
