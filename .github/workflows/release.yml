name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < version.txt)"
          tag="v${version}"

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version.txt must contain a numeric version, got '${version}'" >&2
            exit 1
          fi

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=$(git rev-parse HEAD)"
            echo "subject=$(git log -1 --pretty=%s)"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## ${tag}"
            echo
            echo "Commit: $(git rev-parse --short HEAD)"
            echo
            git log -1 --pretty=%B
          } > release_notes.md

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.subject }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "${{ steps.meta.outputs.tag }}"
            "--target" "${{ steps.meta.outputs.sha }}"
            "--title" "${{ steps.meta.outputs.tag }}"
            "--notes-file" "release_notes.md"
          )

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=("--prerelease")
          fi

          gh release create "${args[@]}"
